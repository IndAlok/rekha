version: "2026.09.04-1"
timezone: Asia/Kolkata
contact_window:
  default_start: "09:00"
  default_end: "19:00"
  rbi_outer_start: "08:00"
  rbi_outer_end: "19:00"
  check_at: dispatch
  provenance: primary
  citations:
    - id: RBI-2022-23-98
      title: Outsourcing of Financial Services, Recovery Agents
      date: 2022-08-12
      url: https://rbi.org.in/Scripts/NotificationUser.aspx?Id=12378&Mode=0
      grade: primary
    - id: TCCCPR-2025
      title: TCCCPR Second Amendment 2025
      grade: primary
      note: Telemarketing window commonly 09:00-21:00; Rekha uses the intersection 09:00-19:00.

emandate:
  framework: Digital Payments, E-mandate Framework, 2026
  date: 2026-04-21
  citation: RBI/DPSS/2026-27/396
  url: https://www.rbi.org.in/Scripts/BS_ViewMasDirections.aspx?id=13374
  grade: primary
  afa_free_ceiling_paise: 1500000
  afa_free_1lakh_categories: [mutual_fund, insurance_premium, credit_card_bill]
  afa_1lakh_ceiling_paise: 10000000
  pdn_min_hours: 24
  amount_change_requires_new_pdn: true
  reissued_cards_map_to_existing_mandate: true

upi_autopay:
  attempt_budget: {original: 1, retries: 3}
  grade: secondary
  note: Confirm 1+3 in writing with the PA. Encoded as config, not a string literal.
  peak_windows_ist:
    - ["10:00", "13:00"]
    - ["17:00", "21:30"]
  allowed_windows_ist:
    - ["00:00", "10:00"]
    - ["13:00", "17:00"]
    - ["21:30", "24:00"]
  collect_deprecated_from: 2026-02-28
  key_on: [mic, umn]
  portability_nudges_forbidden: true
  citation: NPCI/UPI/OC-223/2025-26

nach:
  max_representations: 2
  min_gap_days: 3
  require_customer_balance_confirmation: true
  validity_working_days: 120
  grade: secondary
  citation: NPCI/2023-24/NACH/007

caps:
  max_voice_per_day: 1
  max_sms_per_day: 2
  max_whatsapp_per_week: 3
  max_touches_per_case: 5
  max_cross_channel_per_week: 3
  high_value_approval_paise: 5000000
  payment_link_test_mode_budget: 30

legal:
  s138_does_not_apply_to_mandate_bounce: true
  s25_pss_unsettled_for_pull_debits: true
  agent_may_not_imply_criminal_liability: true

whatsapp:
  debt_collection_as_business_model: forbidden
  framing: first_party_utility_service_reminder

sms:
  category: service_implicit
  coupon_reclassifies_as: promotional
  variable_max_chars: 30
  fixed_content_floor_pct: 30
  url_whitelist: [rzp.io, pages.razorpay.com]

coft:
  store_only: [token_id, last4, issuer]
  pan_forbidden: true

[project]
name = "rekha"
version = "0.2.0"
description = "Bounded revenue recovery for Razorpay test-mode"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sqlalchemy>=2.0.36",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.6.0",
  "pyyaml>=6.0.2",
  "httpx>=0.28.0",
  "python-multipart>=0.0.17",
  "orjson>=3.12.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-cov>=6.0.0",
  "ruff>=0.8.0",
]
razorpay = [
  "razorpay>=1.4.0",
]
postgres = [
  "psycopg[binary]>=3.2.0",
]

[project.scripts]
rekha = "rekha.cli:main"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["apps/api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["apps/api"]
addopts = "--cov=rekha --cov-report=term-missing"

[tool.coverage.run]
branch = true
omit = ["apps/api/rekha/__main__.py"]

[tool.coverage.report]
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 110
target-version = "py312"
